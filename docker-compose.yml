services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on: 
      - backend
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1G

  backend:
    image: quarkuscep-backend
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - JAVA_OPTS_APPEND=--add-opens=java.base/java.lang=ALL-UNNAMED
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 1G

networks:
  app-network:
    driver: bridge
